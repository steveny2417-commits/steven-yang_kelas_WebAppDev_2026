<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>welcome</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Times New Roman', Times, serif, Arial, Helvetica, sans-serif;
            background-color: #0c0c0c;
             background-image: url("bg_login_mdl.jpg.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .container {
            position: relative;
            background-color: #f0f0f0; /* fallback if image missing */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-align: center;
            max-width: 380px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            overflow: hidden;
            color: #fff;
        }
        /* dark overlay to improve text readability */
        .container: {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.35);
            pointer-events: none;
        }
        label { display:block; margin-top:12px; text-align:left; color: #0a0a0a; position: relative; z-index: 1; }
        input[type="email"], input[type="password"] {
            width:100%; padding:8px; margin-top:6px; box-sizing:border-box; position: relative; z-index: 1;
            background: rgba(248, 248, 248, 0.95); color: #000; border: 1px solid #cfcfcf; border-radius:4px;
        }
        .checkbox { display:flex; align-items:center; gap:8px; margin-top:12px; }
        .checkbox { position: relative; z-index: 1; }
        button { margin-top:14px; padding:8px 16px; position: relative; z-index: 1; background:#0069d9; color:#fff; border:none; border-radius:4px; cursor:pointer; }

       
    </style>
</head>
<body>
        <div class="container">
                <img src="Logo-Universitas-Prasetiya-Mulya.png" style="position:center; inset:0; width:90%; height: %; object-fit:logo; z-index:0;">
                <form action="#" method="post">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                    <button type="log in">log in</button>
                <a href="https://youtu.be/QDia3e12czc?si=iWQwg1dHem7-H_Dl" style="position: relative; z-index: 1; color: #605e5e; text-decoration: underline; display:block; margin-top:10px;">Forgot Password?</a>
                </form>
        </div>
</body>
</html>
